# Test-only configuration: the Spring context is verified against an
# in-memory H2 database instead of the MySQL instance used in production.
spring.datasource.url=jdbc:h2:mem:nexusmarket;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.main.banner-mode=off
